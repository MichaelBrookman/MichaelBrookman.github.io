<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBB 5/3/1 Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mut:#667180;--line:#d9dee5;--ok:#1f9d55;--c-squat:#c2410c;--c-bench:#2457d6;--c-ohp:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2128;--ink:#e8ecf1;--mut:#8f9aa8;--line:#2b333d;--ok:#3ecf7a;--c-squat:#fb923c;--c-bench:#6b9cff;--c-ohp:#2dd4bf}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2128;--ink:#e8ecf1;--mut:#8f9aa8;--line:#2b333d;--ok:#3ecf7a;--c-squat:#fb923c;--c-bench:#6b9cff;--c-ohp:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:30px;line-height:1}h2{font-size:22px;margin:18px 0 8px}h3{font-size:21px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.badge{font:700 15px "Barlow Condensed",sans-serif;border:1.5px solid var(--ink);border-radius:6px;padding:3px 9px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 16px Barlow,sans-serif;padding:10px 0;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c-bench);outline-offset:2px}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 0;font:600 15px Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok:not([aria-pressed=true]){border-color:var(--ok);color:var(--ok)}
.wlabel{color:var(--mut);margin:0 0 10px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lc);border-radius:10px;padding:12px 12px 6px;margin-bottom:12px}
.l-squat{--lc:var(--c-squat)}.l-bench{--lc:var(--c-bench)}.l-ohp{--lc:var(--c-ohp)}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ch small{color:var(--mut);font-weight:600}.ch small.ok{color:var(--ok)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
.row .lb{font-weight:600}.row .dt{color:var(--mut);margin-left:auto;text-align:right}
.row.on .lb,.row.on .dt{opacity:.55}
.row.on .lb{text-decoration:line-through}
input[type=number],textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}
.amrap{width:68px;text-align:center}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#b42318;color:#fff}
.small{font-size:14px;padding:6px 10px;margin:4px 0 8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--ok)}
.note{background:var(--card);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 26px "Barlow Condensed",sans-serif}.stat span{color:var(--mut);font-size:14px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px;font-size:14px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
svg text{fill:var(--mut);font:11px Barlow,sans-serif}
.empty{color:var(--mut);padding:16px 4px;text-align:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label{display:block;font-size:14px;color:var(--mut)}.grid3 input{width:100%}
textarea{width:100%;height:90px;font:12px monospace}
</style></head><body><div class="wrap" id="app"></div>
<script>
const LIFTS=[{k:'squat',n:'Squat',d:'Mon'},{k:'bench',n:'Bench',d:'Wed'},{k:'ohp',n:'OHP',d:'Fri'}];
const WEEKS=[{n:'Week 1 · 5/5/5+',p:[65,75,85],r:[5,5,5],a:1},{n:'Week 2 · 3/3/3+',p:[70,80,90],r:[3,3,3],a:1},{n:'Week 3 · 5/3/1+',p:[75,85,95],r:[5,3,1],a:1},{n:'Week 4 · Deload',p:[40,50,60],r:[5,5,5],a:0}];
const ASSIST=[['Lat Pulldown 5×10','Leg Curls 3×12'],['Seated Row 5×10'],['Abs 5 sets','Leg Curls 3×12']];
const BL=[0,2,1]; // BBB lift per day: Squat/Squat, Bench day/OHP, OHP day/Bench
const K='bbb531-v1';
let S,tab='train',wk=null,msg='',armed='',backup='';
const def=()=>({rm:{squat:80,bench:80,ohp:50},pct:.9,inc:{squat:5,bench:2.5,ohp:2.5},bbb:[40,45,60],cycle:1,tmc:{1:{squat:72,bench:72,ohp:45}},ses:{}});
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const r25=x=>Math.round(x/2.5)*2.5,fmt=x=>String(+(+x).toFixed(2));
const bbbPct=c=>S.bbb[(c-1)%S.bbb.length],tmOf=(c,k)=>S.tmc[c][k];
const key=(c,w,d)=>c+'-'+w+'-'+d,today=()=>new Date().toISOString().slice(0,10);
const ITEMS=d=>['s0','s1','s2','bbb',...ASSIST[d].map((_,i)=>'a'+i)];
const done=k=>{const d=+k.split('-')[2],s=S.ses[k];return !!s&&ITEMS(d).every(i=>s.i[i])};
const cnt=k=>{const d=+k.split('-')[2],s=S.ses[k];return s?ITEMS(d).filter(i=>s.i[i]).length:0};
const weekDone=(c,w)=>[0,1,2].every(d=>done(key(c,w,d)));
const cycleDone=c=>[0,1,2,3].reduce((n,w)=>n+[0,1,2].filter(d=>done(key(c,w,d))).length,0);

function card(w,d){
  const L=LIFTS[d],k=key(S.cycle,w,d),s=S.ses[k]||{i:{}},W=WEEKS[w],tm=tmOf(S.cycle,L.k),n=cnt(k),N=ITEMS(d).length;
  const row=(id,lb,dt,ex='')=>`<div class="row ${s.i[id]?'on':''}"><label><input type="checkbox" data-t="${k}|${id}" ${s.i[id]?'checked':''}><span class="lb">${lb}</span><span class="dt">${dt}</span></label>${ex}</div>`;
  let h=`<div class="card l-${L.k}"><div class="ch"><h3>${L.d} · ${L.n}</h3><small class="${n===N?'ok':''}">${n===N?'Done':n+'/'+N}</small></div>`;
  for(let i=0;i<3;i++){
    const plus=W.a&&i===2?'+':'';
    const ex=W.a&&i===2?`<input class="amrap" type="number" inputmode="numeric" min="0" placeholder="reps" aria-label="Reps on last set" value="${s.reps??''}" data-r="${k}">`:'';
    h+=row('s'+i,'Set '+(i+1),`${fmt(r25(tm*W.p[i]/100))} kg × ${W.r[i]}${plus}`,ex);
  }
  const BLf=LIFTS[BL[d]];h+=row('bbb','BBB '+BLf.n+' 5×10',`${fmt(r25(tmOf(S.cycle,BLf.k)*bbbPct(S.cycle)/100))} kg · ${bbbPct(S.cycle)}%`);
  ASSIST[d].forEach((a,i)=>h+=row('a'+i,a,''));
  return h+`<button class="btn ghost small" data-all="${k}">${n===N?'Reset session':'Mark all done'}</button></div>`;
}
function train(){
  const c=S.cycle;
  if(wk===null){wk=[0,1,2,3].find(w=>!weekDone(c,w));if(wk===undefined)wk=3}
  const nd=cycleDone(c),all=nd===12;
  let h=msg?`<div class="note">${msg}</div>`:'';
  h+=`<div class="chips">${[0,1,2,3].map(w=>`<button class="chip ${weekDone(c,w)?'ok':''}" aria-pressed="${w===wk}" data-w="${w}">${w<3?'Wk '+(w+1):'Deload'}${weekDone(c,w)?' ✓':''}</button>`).join('')}</div>`;
  h+=`<p class="wlabel">${WEEKS[wk].n} · TM ${LIFTS.map(L=>fmt(tmOf(c,L.k))).join(' / ')} kg</p>`;
  h+=[0,1,2].map(d=>card(wk,d)).join('');
  h+=`<h2>Cycle ${c}</h2><div class="bar"><i style="width:${nd/12*100}%"></i></div><p class="wlabel">${nd} of 12 sessions done. Next cycle adds ${LIFTS.map(L=>'+'+fmt(S.inc[L.k])+' '+L.n).join(', ')}.</p>`;
  h+=`<button class="btn ${all||armed!=='next'?'':'warn'}" data-a="next">${all?'Finish cycle and calculate next':armed==='next'?'Tap again to confirm':'Finish cycle early'}</button>`;
  return h;
}
function nextCycle(){
  const c=S.cycle,n=c+1,t={};
  LIFTS.forEach(L=>t[L.k]=+(tmOf(c,L.k)+S.inc[L.k]).toFixed(2));
  S.tmc[n]=t;S.cycle=n;wk=null;armed='';
  msg=`Cycle ${n} started. New training maxes: `+LIFTS.map(L=>`${L.n} ${fmt(t[L.k])} kg`).join(', ')+'.';
  save();
}

/* ---------- charts ---------- */
const col=k=>`var(--c-${k})`;
function line(series,xl){
  const W=340,H=190,l=38,r=12,t=10,b=24,P=series.flatMap(s=>s.pts);
  if(!P.length)return '';
  const xs=P.map(p=>p.x),ys=P.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),sp=(Math.max(...ys)-Math.min(...ys))||10;
  const y0=Math.min(...ys)-sp*.15,y1=Math.max(...ys)+sp*.15;
  const X=x=>x1===x0?(l+W-r)/2:l+(x-x0)/(x1-x0)*(W-l-r),Y=y=>t+(1-(y-y0)/(y1-y0))*(H-t-b);
  let g='';
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-5}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  const xt=[...new Set(xs)];const show=xt.length>5?[x0,x1]:xt;
  g+=show.map(x=>`<text x="${X(x)}" y="${H-6}" text-anchor="middle">${xl(x)}</text>`).join('');
  series.forEach(s=>{
    if(!s.pts.length)return;
    g+=`<polyline fill="none" stroke="${col(s.k)}" stroke-width="2.5" stroke-linejoin="round" points="${s.pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`+s.pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="${col(s.k)}"/>`).join('');
  });
  return `<div class="leg">${series.map(s=>`<span><i style="background:${col(s.k)}"></i>${s.n}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
function bars(data){
  const W=340,H=170,l=8,r=8,t=18,b=24,m=Math.max(...data.map(d=>d.v),1),bw=Math.min(46,(W-l-r)/data.length*.6);
  let g='';
  data.forEach((d,i)=>{
    const cx=l+(i+.5)*(W-l-r)/data.length,h=d.v/m*(H-t-b);
    g+=`<rect x="${cx-bw/2}" y="${H-b-h}" width="${bw}" height="${h}" rx="3" fill="var(--ink)" opacity="${d.cur?.45:.9}"/><text x="${cx}" y="${H-b-h-4}" text-anchor="middle">${Math.round(d.v).toLocaleString('en')}</text><text x="${cx}" y="${H-6}" text-anchor="middle">${d.l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
function progress(){
  const pts={squat:[],bench:[],ohp:[]};let sessions=0,vol={};
  Object.entries(S.ses).forEach(([k,s])=>{
    const [c,w,d]=k.split('-').map(Number),L=LIFTS[d],W=WEEKS[w],tm=tmOf(c,L.k);
    if(done(k))sessions++;
    if(s.reps>0&&W.a&&(s.date||s.t)){const wt=r25(tm*W.p[2]/100);pts[L.k].push({x:new Date(s.date||s.t).getTime(),y:wt*(1+s.reps/30)})}
    let v=0;[0,1,2].forEach(i=>{if(s.i['s'+i])v+=r25(tm*W.p[i]/100)*(i===2&&s.reps>0?s.reps:W.r[i])});
    if(s.i.bbb)v+=r25(tmOf(c,LIFTS[BL[d]].k)*bbbPct(c)/100)*50;
    vol[c]=(vol[c]||0)+v;
  });
  LIFTS.forEach(L=>pts[L.k].sort((a,b)=>a.x-b.x));
  const best=k=>pts[k].length?Math.max(...pts[k].map(p=>p.y)):0;
  let h=`<div class="stats"><div class="stat"><b>${sessions}</b><span>sessions done</span></div><div class="stat"><b>${S.cycle-1}</b><span>cycles finished</span></div><div class="stat"><b>${Math.round(Object.values(vol).reduce((a,b)=>a+b,0)/1000*10)/10} t</b><span>total lifted</span></div></div>`;
  h+=`<h2>Estimated 1RM</h2><div class="cc">`;
  const any=LIFTS.some(L=>pts[L.k].length);
  h+=any?line(LIFTS.map(L=>({k:L.k,n:L.n+(best(L.k)?' · best '+fmt(Math.round(best(L.k)*10)/10):''),pts:pts[L.k]})),x=>new Date(x).toLocaleDateString('en-GB',{day:'numeric',month:'short'})):'<div class="empty">Enter the reps you hit on each week’s last set (Weeks 1–3) and your strength trend shows up here.</div>';
  h+=`</div><p class="wlabel">Epley estimate: weight × (1 + reps ÷ 30), from your last set of the main lift.</p>`;
  h+=`<h2>Training max per cycle</h2><div class="cc">`+line(LIFTS.map(L=>({k:L.k,n:L.n,pts:Object.keys(S.tmc).map(c=>({x:+c,y:S.tmc[c][L.k]}))})),x=>'C'+x)+`</div>`;
  h+=`<h2>Volume per cycle (kg)</h2><div class="cc">`+bars(Object.keys(S.tmc).map(c=>({l:'C'+c,v:vol[c]||0,cur:+c===S.cycle})))+`</div><p class="wlabel">Main sets plus BBB for checked items. The lighter bar is the cycle in progress.</p>`;
  return h;
}
function settings(){
  const c=S.cycle,inp=(p,v,step='any')=>`<input type="number" inputmode="decimal" step="${step}" data-s="${p}" value="${v}">`;
  let h=`<h2>Training max, cycle ${c} (kg)</h2><div class="grid3">${LIFTS.map(L=>`<div><label>${L.n}${inp('tm.'+L.k,fmt(tmOf(c,L.k)))}</label></div>`).join('')}</div>`;
  h+=`<h2>Increment per cycle (kg)</h2><div class="grid3">${LIFTS.map(L=>`<div><label>${L.n}${inp('inc.'+L.k,fmt(S.inc[L.k]))}</label></div>`).join('')}</div>`;
  h+=`<h2>BBB % of TM, cycles 1 / 2 / 3</h2><div class="grid3">${[0,1,2].map(i=>`<div><label>Cycle ${i+1}${inp('bbb.'+i,S.bbb[i])}</label></div>`).join('')}</div><p class="wlabel">Cycle 4 onward repeats this pattern.</p>`;
  h+=`<h2>1RM and TM %</h2><div class="grid3">${LIFTS.map(L=>`<div><label>${L.n} 1RM${inp('rm.'+L.k,fmt(S.rm[L.k]))}</label></div>`).join('')}<div><label>TM %${inp('pct',Math.round(S.pct*100))}</label></div></div><button class="btn ghost small" data-a="recalc">${armed==='recalc'?'Tap again to confirm':'Reset this cycle’s TM from 1RM'}</button>`;
  h+=`<h2>Backup</h2><p class="wlabel">Progress is saved in this browser only. Copy the text below to keep a backup, or paste a backup and restore it.</p><textarea id="bk" aria-label="Backup data">${backup}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost small" data-a="show">Show backup</button><button class="btn ghost small" data-a="restore">Restore from text</button></div>`;
  h+=`<h2>Reset</h2><button class="btn ${armed==='reset'?'warn':'ghost'} small" data-a="reset">${armed==='reset'?'Tap again to erase everything':'Erase all progress'}</button>`;
  return h;
}
function render(){
  const tabs=[['train','Train'],['prog','Progress'],['set','Settings']];
  $app.innerHTML=`<div class="top"><h1>BBB 5/3/1</h1><span class="badge">Cycle ${S.cycle}</span></div><div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${n}</button>`).join('')}</div>`+(tab==='train'?train():tab==='prog'?progress():settings());
}
const $app=document.getElementById('app');
$app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.tab){tab=D.tab;armed='';if(tab!=='train')msg=''}
  else if(D.w!==undefined){wk=+D.w}
  else if(D.all){
    const k=D.all,d=+k.split('-')[2],full=done(k),s=S.ses[k]=S.ses[k]||{i:{}};
    ITEMS(d).forEach(i=>s.i[i]=!full);s.t=today();full?delete s.date:s.date=today();save();
  }else if(D.a){
    const a=D.a;
    if(a==='show'){backup=JSON.stringify(S)}
    else if(a==='restore'){try{const o=JSON.parse(document.getElementById('bk').value);if(!o.tmc||!o.ses)throw 0;S=o;wk=null;backup='';save();msg='Backup restored.';tab='train'}catch(x){alert('That text is not a valid backup.')}}
    else if(a==='next'){if(cycleDone(S.cycle)===12||armed==='next')nextCycle();else armed='next'}
    else if(armed!==a){armed=a}
    else if(a==='recalc'){LIFTS.forEach(L=>S.tmc[S.cycle][L.k]=+(S.rm[L.k]*S.pct).toFixed(2));armed='';save()}
    else if(a==='reset'){S=def();wk=null;armed='';msg='';save()}
  }else return;
  render();
});
$app.addEventListener('change',e=>{
  const t=e.target,D=t.dataset;
  if(D.t){const [k,id]=D.t.split('|'),d=+k.split('-')[2],s=S.ses[k]=S.ses[k]||{i:{}};s.i[id]=t.checked;s.t=today();done(k)?s.date=today():delete s.date;save()}
  else if(D.r){const s=S.ses[D.r]=S.ses[D.r]||{i:{}};s.reps=t.value===''?undefined:Math.max(0,+t.value);s.t=today();save()}
  else if(D.s){
    const v=+t.value;if(isNaN(v))return;const [a,b]=D.s.split('.');
    if(D.s==='pct')S.pct=v/100;else if(a==='tm')S.tmc[S.cycle][b]=v;else if(a==='bbb')S.bbb[+b]=v;else S[a][b]=v;
    save();
  }else return;
  if(!D.s)render();
});
S=load();render();
</script></body></html>
